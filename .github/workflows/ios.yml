name: iOS Export

on:
  push:
    branches:
      - main

jobs:
  export-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q Godot_v4.3-stable_macos.universal.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download Export Templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      - name: Export PCK only
        run: |
          mkdir -p output
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-pack iOS output/game.pck
          ls -la output/

      - name: Build IPA from template
        run: |
          TEMPLATE=~/Library/Application\ Support/Godot/export_templates/4.3.stable/ios.zip
          unzip -q "$TEMPLATE" -d iostemplate
          cp output/game.pck iostemplate/godot_ios.pck 2>/dev/null || cp output/game.pck iostemplate/*.pck 2>/dev/null || true
          mkdir -p Payload
          cp -r iostemplate/*.app Payload/ 2>/dev/null || true
          ls -la iostemplate/
          zip -r output/game.ipa Payload
          ls -la output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output/game.ipa
          if-no-files-found: warn
